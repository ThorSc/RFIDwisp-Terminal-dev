; RFID Wisp - WT32-SC01 Plus firmware
; ESP32-S3 dev board with a 3.5" ST7796 touch display, driving an RC522 RFID
; reader (SPI) to read and write the same 16-byte QIDI spool tags as the
; Flutter RFIDwisp app (see ../..). See README.md for wiring before flashing.

[platformio]
default_envs = wt32-sc01-plus

[env:wt32-sc01-plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11
    https://github.com/OSSLibraries/Arduino_MFRC522v2.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

board_build.embed_files = src/fonts/Montserrat-Medium.ttf

extra_scripts = pre:version.py

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include

; Host-side tests of the tag logic (src/qidi_tag.*), `pio test -e native`.
; Runs test/tag_vectors.json, which must stay identical to RFIDwisp's
; test/fixtures/tag_vectors.json.
[env:native]
platform = native
test_framework = custom
test_build_src = yes
test_testing_command = ${platformio.build_dir}/${this.__env__}/program
build_src_filter = -<*> +<qidi_tag.cpp>
lib_deps = bblanchon/ArduinoJson@^7.2.0
