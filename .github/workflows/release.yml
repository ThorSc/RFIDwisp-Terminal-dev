name: Build and publish release

# Runs on every push to master that touches the firmware or the VERSION
# file. The version in VERSION decides whether that push makes a release:
# if the public distribution repo ThorSc/RFIDwisp-Terminal has no release
# v<version> yet, the firmware is built and published as that release (and
# the source commit is tagged v<version>); if it already has one, the run
# stops after the first job and builds nothing. So a release happens by
# bumping VERSION and pushing. This source repo is public too (required for
# LGPL-2.1 compliance: the Arduino-ESP32 core and Arduino_MFRC522v2 are
# statically linked into the firmware and need the full "work that uses the
# library" source available for relinking - see THIRD-PARTY-LICENSES.md) but
# the built firmware is also mirrored as a GitHub Release in the distribution
# repo for a friendlier download experience. Each release bundles
# LICENSE/THIRD-PARTY-LICENSES.md,
# and those two files are additionally synced to the distribution repo's root
# (not just the release zip) so GitHub's license detection picks them up.
#
# The workflow can also be started manually (workflow_dispatch); with
# "rebuild" ticked it rebuilds and re-uploads the assets of a version that
# already has a release.
#
# Setup required once:
#   1. Create the public repo ThorSc/RFIDwisp-Terminal with at least one commit
#      (e.g. a README) - creating a release fails on a completely empty
#      repo ("Repository is empty").
#   2. Create a classic GitHub PAT (Settings -> Developer settings ->
#      Personal access tokens -> Tokens (classic)) with the "public_repo"
#      scope (see RFIDwisp-dev's release.yml for why classic, not
#      fine-grained: the latter repeatedly failed for this cross-repo
#      publish pattern).
#   3. Add it as a secret named RELEASES_REPO_TOKEN in this repo's
#      Settings -> Secrets and variables -> Actions.

on:
  push:
    branches:
      - master
    paths:
      - "wt32sc01plus/**"
      - "VERSION"
      - "LICENSE"
      - "THIRD-PARTY-LICENSES.md"
      - "CHANGELOG.md"
      - "docs/README.dist.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild and re-upload the assets even if this version already has a release"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: two quick pushes must not both find "no release yet"
# and build the same version; the second run then sees the release and skips.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DIST_REPO: ThorSc/RFIDwisp-Terminal
  PIO_ENV: wt32-sc01-plus

jobs:
  prepare:
    # Decides whether this push makes a release, and of which version.
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$REBUILD" != "true" ] && gh release view "$tag" -R "$DIST_REPO" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists - nothing to publish. Bump VERSION to make a new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

  sync-readme:
    # The README of the distribution repo comes from docs/README.dist.md and is
    # kept in step on every run, whether or not this push makes a release.
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync README to distribution repo root
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${DIST_REPO}.git" dist_repo
          cp docs/README.dist.md dist_repo/README.md
          cd dist_repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "README already up to date in $DIST_REPO"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync README.md from source repo"
          git push

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('wt32sc01plus/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: wt32sc01plus
        run: pio run -e "$PIO_ENV"

      - name: Package release asset
        working-directory: wt32sc01plus
        run: |
          set -euo pipefail
          build_dir=".pio/build/$PIO_ENV"
          boot_app0=$(find ~/.platformio/packages/framework-arduinoespressif32/tools/partitions -name boot_app0.bin | head -1)

          out="release_assets/RFIDwisp-ESP32-wt32sc01plus"
          mkdir -p "$out"
          cp "$build_dir/bootloader.bin" "$build_dir/partitions.bin" "$build_dir/firmware.bin" "$out/"
          cp "$boot_app0" "$out/boot_app0.bin"
          cp FLASHING.md "$out/"
          cp data/lang.example.json "$out/"
          cp ../LICENSE ../THIRD-PARTY-LICENSES.md "$out/"
          # The changelog without the unreleased notes.
          awk '/^## \[Unreleased\]/{skip=1;next} /^## \[/{skip=0} !skip' ../CHANGELOG.md > "$out/CHANGELOG.md"

          (cd release_assets && zip -r "RFIDwisp-ESP32-wt32sc01plus-${{ needs.prepare.outputs.tag }}.zip" RFIDwisp-ESP32-wt32sc01plus)

          # The app image alone, as a separate asset: this is what the device
          # downloads for its own update (see src/updater.cpp; the name must
          # match kFirmwareAssetName there).
          cp "$build_dir/firmware.bin" release_assets/RFIDwisp-ESP32-wt32sc01plus-firmware.bin

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            wt32sc01plus/release_assets/*.zip
            wt32sc01plus/release_assets/*-firmware.bin
          if-no-files-found: error

  publish-release:
    # Runs once, after the build finishes, so only a single job ever
    # creates/updates the release and uploads assets to it.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      # To tag the source commit with the release version.
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release_assets

      - name: Release notes from CHANGELOG.md
        # The text of the section "## [x.y.z]" of this version becomes the
        # description of the release.
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.tag }}"
          version="${version#v}"
          tr -d '\r' < CHANGELOG.md \
            | awk -v v="$version" '/^## \[/{p=(index($0,"## [" v "]")==1); next} p' \
            | sed '/./,$!d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No section [$version] in CHANGELOG.md - the release has no description."
          fi

      - name: Publish release to distribution repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_notes.md
          files: release_assets/*

      - name: Sync LICENSE files and changelog to distribution repo root
        # Also committed at the repo root (not just inside each release zip)
        # so GitHub's own license detection/badge on the dist repo works.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${DIST_REPO}.git" dist_repo
          cp LICENSE THIRD-PARTY-LICENSES.md dist_repo/
          awk '/^## \[Unreleased\]/{skip=1;next} /^## \[/{skip=0} !skip' CHANGELOG.md > dist_repo/CHANGELOG.md
          cd dist_repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "LICENSE files and changelog already up to date in $DIST_REPO"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSE THIRD-PARTY-LICENSES.md CHANGELOG.md
          git commit -m "Sync LICENSE, THIRD-PARTY-LICENSES.md and CHANGELOG.md from source repo"
          git push

      - name: Tag the source commit
        # For traceability: which commit of this repo a release was built
        # from. Not fatal (a rebuild finds the tag already there): the
        # release itself is already published.
        continue-on-error: true
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists in this repo"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
